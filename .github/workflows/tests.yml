name: NISE contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12', '3.13']
        exclude:
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=nise-tests.xml
      - name: Run canonical schematic from installed CLI
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          nise compile examples/bearing_catalog.json examples/bearing_query.json --output "$tmp/schematic.json"
          nise inspect "$tmp/schematic.json"
      - name: Require no test failures/errors/skips
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('nise-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 15
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
