[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notations-inference-schematics-engine"
version = "0.1.0"
description = "Constructs query-specific inference schematics for physical-system investigation."
requires-python = ">=3.11"
license = "MPL-2.0"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
nise = "nise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
